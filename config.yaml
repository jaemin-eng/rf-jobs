# ------------------------------------------------------------
# 데이터 소스
# ------------------------------------------------------------
sources:
  # JSearch: LinkedIn / Indeed / Glassdoor / ZipRecruiter 등 (Google for Jobs 기반)
  # 무료 요금제 월 200회: 하루 1회 x 검색어 2개 x 지역 3곳 = 하루 6회 (월 최대 186회)
  jsearch:
    enabled: true
    run_every_days: 1
    # 하루에 지역마다 아래 검색어 중 2개씩 돌아가며 사용 (3일이면 한 바퀴)
    queries_per_day: 2
    rotating_queries:
      - "RF engineer"
      - "antenna engineer"
      - "EMC engineer"
      - "RF design engineer"
      - "microwave engineer"
      - "EMI compliance engineer"

  # Adzuna: 무료 API, 여러 채용 사이트를 모아줌
  # company_sweep: companies.yaml의 회사를 이름으로도 한 번씩 검색 (직접 연결 실패 대비)
  adzuna:
    enabled: true
    company_sweep: true

  # USAJOBS: 연방정부 공고 (대부분 미국 시민권 필요) — DC 지역에서 유용
  usajobs:
    enabled: true
    metros: ["Washington DC", "Boston", "SF Bay Area", "San Diego"]

  # 회사 채용 페이지 직접 연결은 companies.yaml 에서 관리합니다
