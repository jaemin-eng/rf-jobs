name: RF Job Watcher

on:
  schedule:
    # 매일 1회: 미국 동부 오전 7시 = 한국 오후 8시 (UTC 11:00)
    - cron: "0 11 * * *"
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

permissions:
  contents: write      # 수집 기록을 저장소에 커밋
  pages: write         # 대시보드 배포
  id-token: write

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python job_watcher.py

      - name: Save state
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs latest_jobs.md
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push

      # ---- 대시보드(GitHub Pages) 배포 ----
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
