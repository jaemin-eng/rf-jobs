# ============================================================
#  직접 연결할 회사 목록
#
#  group   : 대시보드 필터 이름 (방산 / 연구소 / RF·통신)
#  aliases : 다른 사이트(Adzuna, JSearch)에서 회사 이름이 이렇게 나오면 같은 회사로 봄
#  sources : 확인된 채용 시스템 주소 (있으면 이것을 먼저 사용)
#  careers : 회사 채용 페이지 주소. sources가 없거나 실패하면 이 페이지를 열어서
#            어떤 채용 시스템(Workday, Greenhouse 등)을 쓰는지 자동으로 찾음
#  adzuna  : false로 두면 Adzuna 회사명 검색을 생략
#
#  sources 형식 예:
#    - workday: https://회사.wd5.myworkdayjobs.com/사이트이름
#    - greenhouse: 슬러그        - lever: 슬러그        - ashby: 슬러그
#    - smartrecruiters: 회사ID   - icims: https://careers-xxx.icims.com
#    - phenom: https://careers.xxx.com/global/en
#    - radancy: https://www.xxxjobs.com
#    - successfactors: https://careers.xxx.com
#    - eightfold: {host: careers.xxx.com, domain: xxx.com}
#    - apple: true
# ============================================================

